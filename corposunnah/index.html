<!doctype html>
<html lang="it" class="theme-ymhs">
  <head>
    <meta charset="UTF-8" />
    <script>
      // tema e lingua prima del primo disegno (vedi src/shared/prefs.js)
      try {
        var d = document.documentElement, t = localStorage.getItem('gmi-theme'), l = localStorage.getItem('gmi-lang')
        d.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        if (l) d.lang = l
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ede2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Il menu, per Corpo e Sunnah · GMI Torino</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Il menu del pranzo, in anteprima per Corpo e Sunnah" />

    <meta property="og:image" content="https://gmitorino.org/og-menu.jpg" />
