<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <title>Pagina non trovata · GMI Torino</title>
    <style>
      @font-face { font-family: 'Poppins'; font-weight: 500; font-display: swap; src: url('/fonts/poppins-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Poppins'; font-weight: 700; font-display: swap; src: url('/fonts/poppins-latin-700-normal.woff2') format('woff2'); }
      html, body { margin: 0; min-height: 100svh; background: #fff; color: #0f172a; font-family: 'Poppins', system-ui, sans-serif; }
      main { min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
      .mark { width: 56px; aspect-ratio: 320 / 366; background: linear-gradient(180deg, #004a73, #18abaf); -webkit-mask: url('/brand/gmi-logo.webp') center / contain no-repeat; mask: url('/brand/gmi-logo.webp') center / contain no-repeat; }
      h1 { margin: 0; font-size: clamp(2rem, 9vw, 3.2rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; color: #003451; }
      p { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #0a8f92; }
      nav { display: flex; gap: 10px; margin-top: 8px; }
      a { display: inline-block; padding: 13px 22px; border-radius: 999px; background: #18abaf; color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; }
      a + a { background: #f1f5f9; color: #004a73; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" role="img" aria-label="GMI Torino"></span>
      <p>Errore 404</p>
      <h1>Questa pagina non c'è.</h1>
      <nav>
        <a href="/">Home</a>
        <a href="/menu/">Menu</a>
      </nav>
    </main>
  </body>
</html>
