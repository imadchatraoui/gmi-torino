<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3ECDF" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <title>Pagina non trovata · GMI Torino</title>
    <style>
      @font-face { font-family: 'Bodoni Moda'; font-style: italic; font-weight: 400 600; font-display: swap; src: url('/fonts/bodoni-moda-italic-latin.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-display: swap; src: url('/fonts/ibm-plex-mono-500-latin.woff2') format('woff2'); }
      html, body { margin: 0; min-height: 100svh; background: #f3ecdf; color: #2a1314; }
      main { min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 24px; text-align: center; }
      img { width: 64px; height: auto; }
      h1 { margin: 0; font: italic 400 clamp(2rem, 9vw, 3.4rem)/1.05 'Bodoni Moda', Georgia, serif; }
      p { margin: 0; font: 500 12px/1.6 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; }
      nav { display: flex; gap: 10px; margin-top: 8px; }
      a { display: inline-block; padding: 14px 18px; border: 1.5px solid #8b181a; color: #8b181a; text-decoration: none; font: 500 12px 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.1em; text-transform: uppercase; }
      a:hover { background: #8b181a; color: #f3ecdf; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/gmi-logo.webp" alt="GMI Torino" width="64" height="73" />
      <p>Errore 404</p>
      <h1>Questa pagina non c'è.</h1>
      <nav>
        <a href="/">Home</a>
        <a href="/menu/">Menu</a>
      </nav>
    </main>
  </body>
</html>
